  let board='';
  const bp=prev.__board||{h:-1,n:0},same=bp.h===V.handNo;
  for(let i=0;i<5;i++){const c=V.board[i];board+=c?cardHtml(c,(!same||i>=bp.n)?'new':''):'<div class="card slot"></div>'}
  prev.__board={h:V.handNo,n:V.board.length};
  const seg=(label,a,opts,cur,fmtf)=>`<div class="seg"><span>${label}</span>${opts.map((o,i)=>`<button class="${o===cur||i===cur&&a==='blinds'?'on':''}" data-a="${a}" data-v="${a==='blinds'?i:o}">${fmtf(o)}</button>`).join('')}</div>`;
  const panel=isH?`<details class="panel" ${panelOpen?'open':''}><summary>⚙ ตั้งค่าห้อง</summary><div class="pbody">
    ${V.practice||!ONLINE?'':`<label class="publab"><input type="checkbox" data-a="public" ${V.public?'checked':''}> 🌐 ห้องสาธารณะ (แสดงในล็อบบี้ให้คนอื่นหาเจอ)</label>`}
    <button class="btn sm" data-a="addbot" ${V.seats.length>=MAX_SEATS?'disabled':''}>+ เพิ่มบอท (${V.seats.length}/${MAX_SEATS} ที่นั่ง)</button>
    ${seg('บลายด์ (มีผลมือหน้า)','blinds',BLINDS,V.blindLv,b=>b[0]+'/'+b[1])}
    ${seg('ชิปเริ่มต้น / รีบาย','stack',STACKS,V.stack,fmt)}
    ${seg('เวลาตัดสินใจต่อตา','timer',TIMERS,V.timer,t=>t?t+' วิ':'ไม่จำกัด')}
    <div class="seg"><span>เริ่มมือต่อไปอัตโนมัติ</span><button class="${V.auto?'on':''}" data-a="auto">${V.auto?'เปิด':'ปิด'}</button></div>
    <div class="small">ตอนนี้กด "เชิญออก" ใต้ชื่อผู้เล่นได้ (เฉพาะคนที่ไม่ได้เล่นมือนี้)${V.practice?'':' · ถ้าเครื่องคุณปิดแอพหรือรีเฟรช ห้องจะปิด'}</div>
  </div></details>`:'';
  return`<div class="top">${top}${sndButtons()}<button class="btn sm ghost" data-a="home">ออก</button></div>
  ${V.public?`<div class="pubnote">${pubNoteHtml(V.hostId===myId)}</div>`:''}
  <div class="info">${V.handNo?`มือที่ ${V.handNo} · `:''}บลายด์ ${fmt(V.sb)}/${fmt(V.bb)} · <b style="color:var(--ink)">${PH[V.phase]}</b></div>
  <div class="opps n${opps.length}">${opps.map(oppHtml).join('')||'<div class="seat"><span class="small">ยังไม่มีผู้เล่นอื่น — กด "ชวนเพื่อน" หรือเพิ่มบอทในตั้งค่า</span></div>'}</div>
  <div class="felt">
    <div class="pot">กองกลาง <b>${fmt(V.pot)}</b></div>
    <div class="cards bd">${board}</div>
    ${V.note?`<div class="note">${esc(V.note)}</div>`:`<div class="log">${esc(V.lastLog||'')}</div>`}
  </div>
  ${meHtml(me)}
  ${panel}
  <div class="bar">${barHtml(me)}</div>`;
}

function share(){
  const url=location.protocol.startsWith('http')?location.origin+location.pathname+'?room='+V.code+'&g=poker':'';
  openShare({kind:'room',code:V.code,url,text:'มาเล่นโป๊กเกอร์กัน! รหัสห้อง '+V.code})
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;
  const takeName=()=>{const el=$('#nm');if(!el.value.trim()){toast('ใส่ชื่อก่อนนะ');el.focus();return false}myName=cleanName(el.value);LS.set('ph_name',myName);return true};
  switch(a){
    case 'create':if(takeName())startHost();break;
    case 'join':if(takeName())startJoin($('#cd').value);break;
    case 'practice':if(takeName())startPractice();break;
    case 'home':goHome(false);break;
    case 'leaveok':goHome(true);break;
    case 'leaveno':askLeave=false;render();break;
    case 'retry':startJoin(joinCode);break;
    case 'share':share();break;
    case 'install':doInstall();break;
    case 'menu':goMenu();break;
    case 'shareapp':openShare({kind:'app'});break;
    case 'music':Snd.toggleMusic();render();break;
    case 'sfx':Snd.toggleSfx();render();Snd.play('chip');break;
    case 'fold':case 'check':case 'call':send({t:'act',a});break;
    case 'raise':uiRaise=true;raiseTo=0;render();break;
    case 'rcancel':uiRaise=false;render();break;
    case 'rq':raiseTo=+b.dataset.v;render();break;
    case 'rgo':send({t:'act',a:'raise',to:b.dataset.v?+b.dataset.v:raiseTo});uiRaise=false;break;
    case 'kick':send({t:'kick',id:b.dataset.id});break;
    case 'blinds':case 'stack':case 'timer':send({t:a,v:b.dataset.v});break;
    default:send({t:a});
  }
});
document.addEventListener('input',e=>{
  if(e.target.id!=='rng')return;
  raiseTo=+e.target.value;
  const me=V.seats.find(s=>s.id===myId),maxTo=me.bet+me.chips,verb=V.currentBet===0?'เบท':'เรสเป็น';
  $('#ramt').textContent=fmt(raiseTo);$('#rgo').textContent=(raiseTo>=maxTo?'ออลอิน':verb)+' '+fmt(raiseTo);
});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('panel')&&panelOpen!==e.target.open){panelOpen=e.target.open;render()}},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&screen==='home'&&document.activeElement&&document.activeElement.id==='cd')$('[data-a=join]').click()});
window.addEventListener('beforeunload',e=>{if(isHost&&G&&!G.practice&&G.seats.some(s=>s.id!==myId&&s.online&&!s.bot)){e.preventDefault();e.returnValue=''}});


render();

function lobbyPub(){if(!G||G.practice||!isHost)return;if(!G.public){Lobby.unhost();return}
  const bl=BLINDS[G.blindLv],b=G.seats.filter(s=>s.bot).length;
  Lobby.host({g:'poker',code:G.code,name:myName,n:G.seats.length,max:MAX_SEATS,st:G.phase==='waiting'?'wait':'play',info:'บลายด์ '+bl[0]+'/'+bl[1]+(b?' · บอท '+b:'')})}
Lobby.on(()=>{if(screen==='game'&&V&&V.public)render()});
if(INTENT){const it=INTENT;INTENT=null;myName=it.name;
  if(it.action==='host'){PUBLIC_NEXT=true;startHost()}
  else if(it.action==='join')startJoin(it.code)}

if(QS.has('debug')){Object.defineProperty(window,'G',{get:()=>G,configurable:true});Object.defineProperty(window,'V',{get:()=>V,configurable:true});Object.defineProperty(window,'myId',{get:()=>myId,configurable:true});Object.defineProperty(window,'Snd',{get:()=>Snd,configurable:true});Object.defineProperty(window,'screen',{get:()=>screen,configurable:true});Object.defineProperty(window,'lost',{get:()=>lost,configurable:true});Object.defineProperty(window,'goHome',{get:()=>goHome,configurable:true});Object.defineProperty(window,'send',{get:()=>send,configurable:true});Object.defineProperty(window,'render',{get:()=>render,configurable:true});}
appRender=()=>{if(screen==='home')render()};
appToast=toast;
};

/* ================= หน้าเลือกเกม ================= */
const GAME_INFO={pokdeng:{title:'ป๊อกเด้ง',theme:'#0a3f28'},poker:{title:'โป๊กเกอร์',theme:'#0b1a24'}};
function setTheme(c){const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',c)}

  return`<div class="menu">
  <div class="mlogo">${APP_NAME}</div>
  <div class="msub">เกมไพ่เล่นพร้อมกันกับเพื่อน · ชิปสมมติ ไม่ใช้เงินจริง</div>
  ${ONLINE?`<button class="gcard lb" data-lb="open" aria-label="เปิดล็อบบี้ออนไลน์">
    <span class="lbglobe" aria-hidden="true">🌐</span>
    <span><span class="gname">ล็อบบี้ออนไลน์</span><span class="gdesc" style="display:block">หาคนเล่นด้วย · เข้าห้องที่เปิดอยู่ได้ทันที</span>
    <span class="gtags"><span>ป๊อกเด้ง + โป๊กเกอร์</span><span>⚡ จับคู่อัตโนมัติ</span></span></span>
    <span class="gplay">›</span>
  </button>`:''}
  <button class="gcard pd" data-g="pokdeng" aria-label="เล่นป๊อกเด้ง">
    <span class="mini"><i class="r">9<b>♥</b></i><i>K<b>♠</b></i></span>
    <span><span class="gname">ป๊อกเด้ง</span><span class="gdesc" style="display:block">มีเจ้ามือ · ป๊อก 8 ป๊อก 9 · เด้ง!</span>
    <span class="gtags"><span>2–10 คน</span><span>รอบละไม่กี่นาที</span></span></span>
    <span class="gplay">›</span>
  </button>
  <button class="gcard pk" data-g="poker" aria-label="เล่นโป๊กเกอร์">
    <span class="mini"><i>A<b>♠</b></i><i class="r">K<b>♥</b></i></span>
    <span><span class="gname">โป๊กเกอร์</span><span class="gdesc" style="display:block">เท็กซัสโฮลเด็ม · เบท เรส ออลอิน</span>
    <span class="gtags"><span>2–6 คน</span><span>มีบลายด์</span></span></span>
    <span class="gplay">›</span>
  </button>
  <div class="mnote">${ONLINE?'สร้างห้องแล้วส่งลิงก์ให้เพื่อน หรือฝึกเล่นกับบอทก็ได้':'ลิงก์นี้เล่นกับบอทเท่านั้น · เล่นกับเพื่อนต้องเปิดจากลิงก์ GitHub Pages'}<br>ชิปหมด ต้องนั่งพัก 1 ตา แล้วรีบายได้</div>
  ${installHtml()}
  <button class="mshare" data-share="app">📤 แชร์แอพให้เพื่อน</button>
  <div class="mcredit">By Thitipong Srisomwong</div>
  </div>`;
}
function renderMenu(){document.getElementById('app').innerHTML=menuHtml()}
function menuClick(e){const b=e.target.closest('[data-g],[data-a=install],[data-share],[data-lb],[data-join]');if(!b||b.disabled)return;
  if(b.dataset.lb){lobbyClick(b);return}
  if(b.dataset.join){joinClick(b);return}
  if(b.dataset.share){openShare({kind:'app'});return}
  if(b.dataset.a==='install'){doInstall();return}
  pick(b.dataset.g)}
function boot(id){
  document.removeEventListener('click',menuClick);
  document.body.className='g-'+id;document.title=GAME_INFO[id].title+' · '+APP_NAME;setTheme(GAME_INFO[id].theme);
  GAMES[id]();
}
function pick(id){try{history.replaceState(null,'',location.pathname+location.search+'#'+id)}catch(e){try{location.hash=id}catch(_){}}boot(id)}
if(BOOT)boot(BOOT);
else{document.body.className='g-menu';document.addEventListener('click',menuClick);
  if(HASH==='lobby'&&ONLINE)openLobby();else{appRender=renderMenu;renderMenu()}}
try{const m=sessionStorage.getItem('vp_toast');if(m){sessionStorage.removeItem('vp_toast');setTimeout(()=>appToast(m),300)}}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='lbName')e.target.blur()});
</script>
